<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Async Weather Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;           
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #0f0f2f 0%, #2a0a3a 100%); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            min-height: 100vh;
            color: #e0e0e0; 
            gap: 20px;
        }

        .container {
            background: rgba(10, 10, 25, 0.9); 
            backdrop-filter: blur(8px);
            border-radius: 10px; 
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 40px rgba(0, 255, 255, 0.1); 
            border: 1px solid rgba(0, 255, 255, 0.5);
            width: 100%;
            max-width: 400px;
        }

        .dom-card {
            background: rgba(10, 10, 25, 0.9); 
            backdrop-filter: blur(8px);
            border-radius: 10px; 
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 87, 51, 0.3);
            border: 1px solid rgba(255, 87, 51, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1, h2 {
            text-align: center;
            color: #00f0ff;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.7); 
        }

        h2 {
            color: #ff9500;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .search-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #00aaff;
            background-color: #1a1a3a; 
            color: #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); 
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(90deg, #ff5733 0%, #ff9500 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 87, 51, 0.4); 
        }

        button:hover {
            background: linear-gradient(90deg, #ff9500 0%, #ff5733 100%); 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 87, 51, 0.6);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(255, 87, 51, 0.3);
        }

        .loading {
            text-align: center;
            color: #00f0ff;
            font-style: italic;
            font-size: 14px;
            text-shadow: 0 0 2px rgba(0, 255, 255, 0.5);
            display: none;
        }

        .loading.show {
            display: block;
        }

        .error {
            color: #ff5733;
            text-align: center;
            display: none;
            font-size: 14px;
            margin-bottom: 15px;
            text-shadow: 0 0 3px rgba(255, 87, 51, 0.5);
        }

        .error.show {
            display: block;
        }

        .weather-info {
            background: rgba(0, 255, 255, 0.05); 
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.2); 
            padding: 20px;
            text-align: center;
            display: none;
        }

        .weather-info.show {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .city {
            font-size: 24px;
            font-weight: 700;
            color: #00f0ff;
            margin-bottom: 8px;
            text-shadow: 0 0 3px rgba(0, 255, 255, 0.5);
        }

        .temp {
            font-size: 56px;
            font-weight: 300;
            color: #ff5733;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255, 87, 51, 0.7);
        }

        .description {
            font-size: 18px;           
            color: #aaffaa;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .details {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 15px;
            gap: 15px;
            border-top: 1px dashed rgba(0, 255, 255, 0.2); 
            padding-top: 15px;
        }

        .detail {
            text-align: center;
            flex-basis: calc(33% - 10px);
            min-width: 80px;
            background: rgba(0, 255, 255, 0.03); 
            border-radius: 5px;
            padding: 8px 0;
        }

        .detail-icon {
            font-size: 20px;            
            display: block;
            margin-bottom: 3px;
            color: #00f0ff; 
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .detail-label {
            font-size: 11px;
            color: #aaaaaa; 
            text-transform: uppercase;
        }

        .output {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 5px;
            padding: 15px;
            font-family: monospace;
            font-size: 16px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Async Weather Tracker</h1>

        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Search city..." aria-label="City name">
            <button type="button" onclick="getWeather()">Search</button>
        </div>

        <div class="loading" id="loading">🌤️ Loading weather...</div>
        <div class="error" id="errorMsg" aria-live="polite"></div>

        <div class="weather-info" id="weatherInfo">
            <div class="city" id="city">--</div>
            <div class="temp" id="temp">--</div>
            <div class="description" id="description">--</div>
            <div class="details">
                <div class="detail">
                    <span class="detail-icon">💨</span>
                    <span class="detail-value" id="wind">--</span>
                    <span class="detail-label">Wind</span>
                </div>
                <div class="detail">
                    <span class="detail-icon">☁️</span>
                    <span class="detail-value" id="humidity">--</span>
                    <span class="detail-label">Humidity</span>
                </div>
                <div class="detail">
                    <span class="detail-icon">🌡️</span>
                    <span class="detail-value" id="pressure">--</span>
                    <span class="detail-label">Pressure</span>
                </div>
            </div>
        </div>
    </div>

    <div class="dom-card">
        <h2>⌨️ DOM Manipulation Demo</h2>
        <div class="output" id="keyOutput" aria-live="polite">Press any key...</div>
    </div>
</body>
</html>

<script>
    const API_KEY = '42b00ca05e868fad7f1bac0e292c332d';
    const API_URL = 'https://api.openweathermap.org/data/2.5/weather';

    function getWeather(city = 'Gurugram') {

        const cityInput = document.getElementById('cityInput').value.trim() || city;
        const weatherInfo = document.getElementById('weatherInfo');
        const errorMsg = document.getElementById('errorMsg');
        const loadingEl = document.getElementById('loading');

        errorMsg.classList.remove('show');
        weatherInfo.classList.remove('show');
        loadingEl.classList.add('show');

        document.getElementById('temp').textContent = '--';
        document.getElementById('description').textContent = '--';

        if (!cityInput) {
            errorMsg.textContent = 'Please enter a city name.';
            errorMsg.classList.add('show');
            loadingEl.classList.remove('show');
            return;
        }

        const url = `${API_URL}?q=${encodeURIComponent(cityInput)}&appid=${API_KEY}&units=metric`;

        fetch(url)

            .then(function(response) {
                if (!response.ok) {
                    throw new Error("City not found: " + cityInput);
                }
                return response.json();
            })

            .then(function(data) {
                displayWeather(data);
            })

            .catch(function(error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.add('show');
            })

            .finally(function() {
                loadingEl.classList.remove('show');
            });
      }

    function displayWeather(data) {

    var name = "Unknown";
    if (data.name) {
        name = data.name;
    }

    var temp = "--";
    if (data.main && data.main.temp) {
        temp = Math.round(data.main.temp) + "°C";
    }

    var desc = "N/A";
    if (data.weather && data.weather[0] && data.weather[0].description) {
        desc = data.weather[0].description;
    }

    var wind = "--";
    if (data.wind && data.wind.speed) {
        wind = data.wind.speed + " highest/s";
    }

    var humidity = "--";
    if (data.main && data.main.humidity) {
        humidity = data.main.humidity + "%";
    }

    var pressure = "--";
    if (data.main && data.main.pressure) {
        pressure = data.main.pressure + " hPa";
    }

    document.getElementById("city").textContent = name;
    document.getElementById("temp").textContent = temp;
    document.getElementById("description").textContent = desc;
    document.getElementById("wind").textContent = wind;
    document.getElementById("humidity").textContent = humidity;
    document.getElementById("pressure").textContent = pressure;

    document.getElementById("weatherInfo").classList.add("show");
}

    document.getElementById('cityInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            getWeather();
        }
    });

    window.onload = function() {
        getWeather('Gurugram');
    };

    document.addEventListener("keydown", function(e) {
        document.getElementById("keyOutput").innerText =
            `You Pressed: ${e.key} (code: ${e.code})`;
    });
</script>
